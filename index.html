<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureNotes App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans select-none">

    <!-- SCHERMATA DI LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">🔒 Area Protetta</h2>
            <p class="text-sm text-gray-500 mb-6">Inserisci la password per accedere</p>
            <input type="password" id="password-input" placeholder="Password" class="w-full px-4 py-3 border border-gray-300 rounded-xl mb-4 text-center text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="checkPassword()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition">Accedi</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden">Password errata!</p>
        </div>
    </div>

    <!-- APP PRINCIPALE -->
    <div id="app-screen" class="flex-1 flex flex-col md:flex-row h-full hidden overflow-hidden">
        
        <!-- Sidebar Documenti -->
        <div class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col h-1/3 md:h-full">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-indigo-50">
                <h1 class="font-bold text-indigo-900 text-lg">📝 I Miei Documenti</h1>
                <button onclick="createNewDoc()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ Nuovo</button>
            </div>
            
            <!-- Barra di Ricerca Globale -->
            <div class="p-3 border-b border-gray-100">
                <input type="text" id="search-input" oninput="filterDocuments()" placeholder="Cerca parole in tutti i file..." class="w-full px-3 py-2 bg-gray-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Lista Documenti -->
            <div id="doc-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <!-- Popolato da JS -->
            </div>
        </div>

        <!-- Area Editor -->
        <div class="flex-1 flex flex-col h-2/3 md:h-full bg-white">
            <div id="editor-container" class="flex-1 flex flex-col h-full hidden">
                <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
                    <input type="text" id="doc-title" oninput="updateDocTitle()" placeholder="Titolo documento..." class="font-bold text-lg bg-transparent text-gray-800 focus:outline-none w-2/3">
                    <button onclick="deleteCurrentDoc()" class="text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1 rounded bg-red-50">Elimina</button>
                </div>
                <textarea id="doc-content" oninput="updateDocContent()" placeholder="Inizia a scrivere qui..." class="flex-1 p-4 resize-none focus:outline-none text-gray-700 leading-relaxed"></textarea>
            </div>
            <div id="no-doc-selected" class="flex-1 flex items-center justify-center text-gray-400 text-sm">
                Seleziona o crea un documento per iniziare
            </div>
        </div>
    </div>

    <script>
        let docs = JSON.parse(localStorage.getItem('secure_notes')) || [
            { id: 1, title: 'Benvenuto', content: 'Benvenuto nella tua app di testo protetta! Cerca una parola e clicca sul file per trovarla subito.' },
            { id: 2, title: 'Note Segrete', content: 'Questa è una nota di esempio contenente la parola segreto che puoi cercare.' }
        ];
        let currentDocId = null;
        const correctPassword = "6971"; // Cambia la password qui

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === correctPassword) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                renderDocList();
                if (docs.length > 0) selectDoc(docs[0].id);
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function saveDocs() {
            localStorage.setItem('secure_notes', JSON.stringify(docs));
        }

        function renderDocList(filterText = '') {
            const listEl = document.getElementById('doc-list');
            listEl.innerHTML = '';
            
            const query = filterText.trim().toLowerCase();

            const processedDocs = docs.map(doc => {
                let matchCount = 0;
                let snippet = doc.content || 'Nessun contenuto';
                
                if (query) {
                    const titleMatch = doc.title.toLowerCase().includes(query);
                    const contentLower = doc.content.toLowerCase();
                    
                    let pos = contentLower.indexOf(query);
                    while (pos !== -1) {
                        matchCount++;
                        pos = contentLower.indexOf(query, pos + 1);
                    }
                    
                    if (titleMatch) matchCount += 10;

                    if (contentLower.includes(query)) {
                        const index = contentLower.indexOf(query);
                        const start = Math.max(0, index - 25);
                        const end = Math.min(doc.content.length, index + query.length + 25);
                        snippet = '...' + doc.content.substring(start, end) + '...';
                    }
                }

                return {
                    ...doc,
                    matchCount,
                    snippet,
                    isMatch: query === '' || doc.title.toLowerCase().includes(query) || doc.content.toLowerCase().includes(query)
                };
            }).filter(d => d.isMatch);

            if (processedDocs.length === 0) {
                listEl.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">Nessuna parola trovata nei documenti</div>';
                return;
            }

            processedDocs.forEach(doc => {
                const item = document.createElement('div');
                item.className = `p-4 cursor-pointer transition hover:bg-gray-50 ${doc.id === currentDocId ? 'bg-indigo-50 border-l-4 border-indigo-600' : ''}`;
                
                // Quando clicchi, passiamo anche la query di ricerca attuale per evidenziare la parola
                item.onclick = () => selectDoc(doc.id, query);
                
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <div class="font-semibold text-gray-800 truncate">${doc.title || 'Senza titolo'}</div>
                        ${query && doc.matchCount > 0 ? `<span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-medium">Trovata</span>` : ''}
                    </div>
                    <div class="text-xs text-gray-500 truncate">${doc.snippet}</div>
                `;
                listEl.appendChild(item);
            });
        }

        function filterDocuments() {
            const query = document.getElementById('search-input').value;
            renderDocList(query);
        }

        function selectDoc(id, query = '') {
            currentDocId = id;
            const doc = docs.find(d => d.id === id);
            document.getElementById('no-doc-selected').classList.add('hidden');
            document.getElementById('editor-container').classList.remove('hidden');
            document.getElementById('doc-title').value = doc.title;
            
            const textarea = document.getElementById('doc-content');
            textarea.value = doc.content;

            // Se c'è una ricerca attiva, evidenzia/seleziona automaticamente la parola nel testo
            if (query) {
                const contentLower = doc.content.toLowerCase();
                const index = contentLower.indexOf(query.toLowerCase());
                if (index !== -1) {
                    textarea.focus();
                    textarea.setSelectionRange(index, index + query.length);
                }
            }

            renderDocList(document.getElementById('search-input').value);
        }

        function createNewDoc() {
            const newDoc = { id: Date.now(), title: 'Nuovo Documento', content: '' };
            docs.unshift(newDoc);
            saveDocs();
            selectDoc(newDoc.id);
        }

        function updateDocTitle() {
            const doc = docs.find(d => d.id === currentDocId);
            if (doc) {
                doc.title = document.getElementById('doc-title').value;
                saveDocs();
                renderDocList(document.getElementById('search-input').value);
            }
        }

        function updateDocContent() {
            const doc = docs.find(d => d.id === currentDocId);
            if (doc) {
                doc.content = document.getElementById('doc-content').value;
                saveDocs();
                renderDocList(document.getElementById('search-input').value);
            }
        }

        function deleteCurrentDoc() {
            if (confirm('Sei sicuro di voler eliminare questo documento?')) {
                docs = docs.filter(d => d.id !== currentDocId);
                saveDocs();
                currentDocId = null;
                document.getElementById('editor-container').classList.add('hidden');
                document.getElementById('no-doc-selected').classList.remove('hidden');
                renderDocList(document.getElementById('search-input').value);
            }
        }
    </script>
</body>
</html>
